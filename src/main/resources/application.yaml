spring:
  application:
    name: library-manager

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:file:./db/library;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: librarian
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      jakarta:
        persistence:
          query:
            timeout: 5000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: 'UTF-8'
    cleanDatabase: false
    placeholders:
      userRole: 'ROLE_USER'
      librarianRole: 'ROLE_LIBRARIAN'

logging:
  level:
    root: INFO
    com.ppossatto.librarymanager: DEBUG

security:
  jwt:
    secret: 33OL23Q2FEOBVUQ5E4VIACSI75XCI54BP1JTI0KA5OO3XTSYHB2ZYYM0E5VYJHUK
    expiration: 3600000 # 1h

scheduler:
  cleanup:
    users: 0 0 3 * * *

reservation:
  period: 7 # days

springdoc:
  api-docs:
    path: /api-docs
    enabled: true

  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    syntax-highlight:
      activated: true

server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: library-manager